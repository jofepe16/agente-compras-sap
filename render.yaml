services:
  - type: web
    name: mesa-compras-periferia
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.20.0
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_API_KEY
        sync: false
